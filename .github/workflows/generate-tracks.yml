name: Generate Tracks Pack

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the accompaniment style and mood"
        required: true
        type: string
        default: "Upbeat pop keyboard accompaniment, warm bass, punchy drums, bright chords"
      bpm:
        description: "Tempo in BPM (45-220)"
        required: true
        type: number
        default: 110
      bars:
        description: "Number of bars to generate"
        required: true
        type: choice
        options:
          - "4"
          - "8"
          - "16"
        default: "4"
      seed:
        description: "Random seed for reproducible synthesis"
        required: true
        type: number
        default: 42
      planner:
        description: "Planner: local language model or built-in planner"
        required: true
        type: choice
        options:
          - local_model
          - built_in
        default: local_model
      lyria_preview:
        description: "Also generate an AI music preview with Lyria (requires GEMINI_API_KEY)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tracks-generator-main
  cancel-in-progress: false

jobs:
  generate:
    name: Generate WAV stems, MIDI and ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache local GGUF model
        if: inputs.planner == 'local_model'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tracks-generator/models
          key: qwen2.5-1.5b-instruct-q4km-rev-91cad511-v1

      - name: Download local language model
        if: inputs.planner == 'local_model'
        shell: bash
        run: |
          set -euo pipefail
          model_dir="$HOME/.cache/tracks-generator/models"
          model_path="$model_dir/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          mkdir -p "$model_dir"
          if [ ! -f "$model_path" ] || [ "$(stat -c%s "$model_path")" -lt 1000000000 ]; then
            rm -f "$model_path"
            curl -fL --retry 3 --retry-delay 2 \
              "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/91cad51170dc346986eccefdc2dd33a9da36ead5/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true" \
              -o "$model_path"
          fi
          test "$(stat -c%s "$model_path")" -ge 1000000000
          echo "TRACKS_MODEL_PATH=$model_path" >> "$GITHUB_ENV"
          echo "Local model ready ($(du -h "$model_path" | cut -f1))."

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install local model runtime
        if: inputs.planner == 'local_model'
        run: python -m pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Generate tracks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKS_PROMPT: ${{ inputs.prompt }}
          TRACKS_BPM: ${{ inputs.bpm }}
          TRACKS_BARS: ${{ inputs.bars }}
          TRACKS_SEED: ${{ inputs.seed }}
          TRACKS_PLANNER: ${{ inputs.planner }}
          TRACKS_LYRIA_PREVIEW: ${{ inputs.lyria_preview }}
        run: |
          python scripts/generate_tracks.py \
            --prompt "$TRACKS_PROMPT" \
            --bpm "$TRACKS_BPM" \
            --bars "$TRACKS_BARS" \
            --seed "$TRACKS_SEED" \
            --planner "$TRACKS_PLANNER" \
            --output output \
            $( [ "$TRACKS_LYRIA_PREVIEW" = "true" ] && printf '%s' '--lyria' )

      - name: Validate generated package
        run: |
          python - <<'PY'
          import io
          import json
          import wave
          import zipfile
          from pathlib import Path
          import mido

          package = Path("output/tracks-generator.zip")
          assert package.is_file(), "ZIP was not created"
          with zipfile.ZipFile(package) as zf:
              names = set(zf.namelist())
              required = (
                  "manifest.json", "arrangement.json", "preview.wav",
                  "audio/drums.wav", "audio/bass.wav", "audio/chords.wav",
                  "audio/melody.wav", "audio/pad.wav",
                  "midi/drums.mid", "midi/bass.mid", "midi/chords.mid",
                  "midi/melody.mid", "midi/pad.mid",
              )
              for name in required:
                  assert name in names, f"Missing in ZIP: {name}"
              manifest = json.loads(zf.read("manifest.json"))
              assert manifest["format"] == "ARRSTYLE"
              assert manifest["settings"]["bpm"] >= 45
              assert manifest["generation"]["planner"] in (
                  "local-qwen2.5-1.5b-instruct", "built-in-fallback"
              )
              wav_lengths = set()
              for name in sorted(n for n in names if n.endswith(".wav")):
                  with wave.open(io.BytesIO(zf.read(name)), "rb") as w:
                      assert w.getnchannels() == 1 and w.getsampwidth() == 2
                      wav_lengths.add(w.getnframes())
              assert len(wav_lengths) == 1, f"WAV duration mismatch: {wav_lengths}"
              for name in sorted(n for n in names if n.startswith("midi/") and n.endswith(".mid")):
                  assert mido.MidiFile(file=io.BytesIO(zf.read(name))).tracks
              print(f"Validated {len(names)} files. Planner: {manifest['generation']['planner']}.")
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracks-generator-${{ github.run_number }}
          path: output/tracks-generator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload unpacked output (optional)
        uses: actions/upload-artifact@v4
        with:
          name: tracks-generator-files-${{ github.run_number }}
          path: output/package/
          if-no-files-found: error
          retention-days: 14
